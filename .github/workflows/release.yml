name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download single-file EXE
        uses: actions/download-artifact@v8
        with:
          name: CdpSwitcher.exe
          path: dist
          skip-decompress: true

      - name: Download complete app ZIP
        uses: actions/download-artifact@v8
        with:
          name: CdpSwitcher-win-x64.zip
          path: dist
          skip-decompress: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum CdpSwitcher.exe CdpSwitcher-win-x64.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            dist/CdpSwitcher.exe \
            dist/CdpSwitcher-win-x64.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${release_flags[@]}"
